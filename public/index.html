<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat WebSocket</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #f0f2f5; margin: 0; display: flex; justify-content: center; }
    #app { width: 100%; max-width: 560px; height: 100vh; display: flex; flex-direction: column; background: #fff; }
    header { padding: 12px 16px; background: #2563eb; color: #fff; display: flex; justify-content: space-between; }
    #mensajes { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 80%; padding: 8px 12px; border-radius: 12px; background: #e5e7eb; word-wrap: break-word; }
    .msg.propio { align-self: flex-end; background: #2563eb; color: #fff; }
    .msg small { display: block; opacity: 0.7; font-size: 0.7rem; margin-bottom: 2px; }
    .sistema { align-self: center; font-size: 0.8rem; color: #6b7280; }
    form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #e5e7eb; }
    input { flex: 1; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 1rem; }
    button { padding: 10px 16px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <strong>Chat en vivo</strong>
      <span id="usuarios">0 conectados</span>
    </header>
    <div id="mensajes"></div>
    <form id="form">
      <input id="texto" placeholder="Escribe un mensaje..." autocomplete="off" />
      <button>Enviar</button>
    </form>
  </div>

  <script>
    const nombre = prompt("Tu nombre:") || "Anónimo";

    // Usa wss:// automáticamente si la página está en https
    const protocolo = location.protocol === "https:" ? "wss" : "ws";
    const ws = new WebSocket(`${protocolo}://${location.host}`);

    const mensajes = document.getElementById("mensajes");
    const form = document.getElementById("form");
    const input = document.getElementById("texto");

    ws.addEventListener("open", () => {
      ws.send(JSON.stringify({ tipo: "unirse", nombre }));
    });

    ws.addEventListener("message", (evento) => {
      const msg = JSON.parse(evento.data);

      if (msg.tipo === "usuarios") {
        document.getElementById("usuarios").textContent = `${msg.cantidad} conectados`;
        return;
      }

      const div = document.createElement("div");

      if (msg.tipo === "sistema") {
        div.className = "sistema";
        div.textContent = msg.texto;
      } else {
        div.className = "msg" + (msg.nombre === nombre ? " propio" : "");
        const meta = document.createElement("small");
        meta.textContent = `${msg.nombre} · ${msg.hora}`;
        const texto = document.createElement("span");
        texto.textContent = msg.texto; // textContent evita inyección de HTML (XSS)
        div.append(meta, texto);
      }

      mensajes.appendChild(div);
      mensajes.scrollTop = mensajes.scrollHeight;
    });

    ws.addEventListener("close", () => {
      const div = document.createElement("div");
      div.className = "sistema";
      div.textContent = "Conexión perdida. Recarga la página.";
      mensajes.appendChild(div);
    });

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const texto = input.value.trim();
      if (!texto || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ tipo: "mensaje", texto }));
      input.value = "";
    });
  </script>
</body>
</html>
